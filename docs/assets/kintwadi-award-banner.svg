<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img"
     aria-label="Kintwadi — Winner, Best Design. H0: Hack the Zero Stack. One shared record for everyone caring for someone.">
  <title>Kintwadi — Winner, Best Design · H0: Hack the Zero Stack</title>

  <defs>
    <!-- ============ palette / gradients ============ -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0C1613"/>
      <stop offset="55%"  stop-color="#0E1B18"/>
      <stop offset="100%" stop-color="#101512"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F4C86A" stop-opacity=".55"/>
      <stop offset="38%"  stop-color="#2DD4BF" stop-opacity=".28"/>
      <stop offset="75%"  stop-color="#F0916F" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#F4C86A" stop-opacity=".50"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E8B24C"/>
      <stop offset="50%"  stop-color="#FFE3A3"/>
      <stop offset="100%" stop-color="#E8B24C"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="62%"  stop-color="#DDEAE2"/>
      <stop offset="100%" stop-color="#A8C6BB"/>
    </linearGradient>

    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#FFF6DF" stop-opacity=".85"/>
      <stop offset="55%"  stop-color="#FFF6DF" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pillShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFE9BC" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFE9BC" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#FFE9BC" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ringCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity=".22"/>
      <stop offset="70%"  stop-color="#0F766E" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>

    <!-- ============ filters ============ -->
    <filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ============ texture ============ -->
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#8FB3A6" fill-opacity=".13"/>
    </pattern>

    <clipPath id="frame">
      <rect x="1" y="1" width="1278" height="378" rx="28"/>
    </clipPath>

    <!-- wordmark mask, used to sweep a highlight across the letterforms -->
    <mask id="wordMask">
      <text x="64" y="212" font-family="Fraunces, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif"
            font-size="104" font-weight="700" letter-spacing="-1.5" fill="#fff">Kintwadi</text>
    </mask>

    <style>
      /* ---------- keyframes ---------- */
      @keyframes drift-a { 0%,100% { transform: translate(0,0) scale(1); }
                           50%     { transform: translate(90px,34px) scale(1.16); } }
      @keyframes drift-b { 0%,100% { transform: translate(0,0) scale(1.06); }
                           50%     { transform: translate(-72px,-40px) scale(.9); } }
      @keyframes drift-c { 0%,100% { transform: translate(0,0) scale(.95); }
                           50%     { transform: translate(46px,-52px) scale(1.2); } }

      @keyframes spin      { to { transform: rotate(360deg); } }
      @keyframes spin-back { to { transform: rotate(-360deg); } }

      @keyframes breathe { 0%,100% { transform: scale(1);    opacity: .95; }
                           50%     { transform: scale(1.09); opacity: 1; } }

      @keyframes halo { 0%       { transform: scale(.55); opacity: .75; }
                        70%,100% { transform: scale(2.5); opacity: 0; } }

      @keyframes sweep { 0%      { transform: translateX(-260px); }
                         42%,100%{ transform: translateX(560px); } }

      @keyframes pillSweep { 0%      { transform: translateX(-220px); }
                             55%,100%{ transform: translateX(460px); } }

      @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.7) rotate(0deg); }
                           50%     { opacity: 1;   transform: scale(1.15) rotate(45deg); } }

      @keyframes riseIn { from { opacity: 0; transform: translateY(14px); }
                          to   { opacity: 1; transform: translateY(0); } }

      @keyframes drawLine { from { stroke-dashoffset: 120; opacity: 0; }
                            to   { stroke-dashoffset: 0;   opacity: .5; } }

      @keyframes goldPulse { 0%,100% { opacity: .85; } 50% { opacity: 1; } }

      /* ---------- bindings ---------- */
      .blob-a { animation: drift-a 17s ease-in-out infinite; }
      .blob-b { animation: drift-b 21s ease-in-out infinite; }
      .blob-c { animation: drift-c 25s ease-in-out infinite; }

      .arc-gold  { transform-origin: 0 0; animation: spin 11s linear infinite, goldPulse 4s ease-in-out infinite; }
      .ring-dash { transform-origin: 0 0; animation: spin-back 34s linear infinite; }
      .orbit     { transform-origin: 0 0; animation: spin 44s linear infinite; }
      .heart     { transform-origin: 0 0; animation: breathe 2.6s ease-in-out infinite; }

      .pulse     { transform-origin: 0 0; animation: halo 3.4s ease-out infinite; }
      .p2 { animation-delay: .55s; } .p3 { animation-delay: 1.1s; }
      .p4 { animation-delay: 1.65s; } .p5 { animation-delay: 2.2s; } .p6 { animation-delay: 2.75s; }

      .spoke { stroke-dasharray: 120; animation: drawLine 1.5s ease-out both; }
      .s2 { animation-delay: .1s; } .s3 { animation-delay: .2s; } .s4 { animation-delay: .3s; }
      .s5 { animation-delay: .4s; } .s6 { animation-delay: .5s; }

      .sheen      { animation: sweep 6.5s ease-in-out 1.1s infinite; }
      .pill-shine { animation: pillSweep 6.5s ease-in-out .5s infinite; }

      .spark  { transform-origin: 0 0; animation: twinkle 3s ease-in-out infinite; }
      .k2 { animation-delay: .7s; } .k3 { animation-delay: 1.4s; }
      .k4 { animation-delay: 2.1s; } .k5 { animation-delay: 2.8s; }

      .rise   { animation: riseIn .9s cubic-bezier(.22,.9,.3,1) both; }
      .r1 { animation-delay: .10s; } .r2 { animation-delay: .26s; } .r3 { animation-delay: .42s; }
      .r4 { animation-delay: .58s; } .r5 { animation-delay: .74s; } .r6 { animation-delay: .90s; }

      /* respect the reader */
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .spoke { stroke-dashoffset: 0; opacity: .5; }
      }
    </style>
  </defs>

  <!-- ================= backdrop ================= -->
  <g clip-path="url(#frame)">
    <rect width="1280" height="380" fill="url(#bg)"/>

    <g opacity=".85" filter="url(#blobBlur)">
      <ellipse class="blob-a" cx="250"  cy="90"  rx="270" ry="170" fill="#0F766E" fill-opacity=".55"/>
      <ellipse class="blob-b" cx="1050" cy="300" rx="300" ry="180" fill="#EC7C5A" fill-opacity=".22"/>
      <ellipse class="blob-c" cx="900"  cy="60"  rx="240" ry="150" fill="#14B8A6" fill-opacity=".28"/>
    </g>

    <rect width="1280" height="380" fill="url(#dots)"/>
    <rect width="1280" height="380" fill="#0C1613" fill-opacity=".28"/>

    <!-- ================= care-circle motif ================= -->
    <g transform="translate(1058 190)">
      <circle r="120" fill="url(#ringCore)"/>

      <!-- award arc encircling the circle of care -->
      <g class="arc-gold" filter="url(#softGlow)">
        <circle r="132" fill="none" stroke="url(#gold)" stroke-width="3"
                stroke-linecap="round" stroke-dasharray="150 680"/>
        <circle r="132" fill="none" stroke="#FFE3A3" stroke-width="2" stroke-opacity=".55"
                stroke-linecap="round" stroke-dasharray="34 796" stroke-dashoffset="-320"/>
      </g>
      <circle r="132" fill="none" stroke="#2DD4BF" stroke-opacity=".16" stroke-width="1.5"/>

      <g class="ring-dash">
        <circle r="96" fill="none" stroke="#7FE3D4" stroke-opacity=".32" stroke-width="1.6"
                stroke-dasharray="2 11" stroke-linecap="round"/>
      </g>

      <!-- spokes: one record, many people -->
      <g stroke="#8FE6D8" stroke-opacity=".5" stroke-width="1.2">
        <line class="spoke"    x1="0" y1="0" x2="0"     y2="-96"/>
        <line class="spoke s2" x1="0" y1="0" x2="83.1"  y2="-48"/>
        <line class="spoke s3" x1="0" y1="0" x2="83.1"  y2="48"/>
        <line class="spoke s4" x1="0" y1="0" x2="0"     y2="96"/>
        <line class="spoke s5" x1="0" y1="0" x2="-83.1" y2="48"/>
        <line class="spoke s6" x1="0" y1="0" x2="-83.1" y2="-48"/>
      </g>

      <!-- the circle: family, aide, sibling, clinician… -->
      <g class="orbit">
        <g transform="translate(0 -96)">
          <circle class="pulse"    r="7" fill="#2DD4BF"/><circle r="7" fill="#2DD4BF" filter="url(#tinyGlow)"/>
        </g>
        <g transform="translate(83.1 -48)">
          <circle class="pulse p2" r="7" fill="#F0916F"/><circle r="7" fill="#F0916F" filter="url(#tinyGlow)"/>
        </g>
        <g transform="translate(83.1 48)">
          <circle class="pulse p3" r="7" fill="#EAF1EC"/><circle r="7" fill="#EAF1EC"/>
        </g>
        <g transform="translate(0 96)">
          <circle class="pulse p4" r="7" fill="#2DD4BF"/><circle r="7" fill="#2DD4BF" filter="url(#tinyGlow)"/>
        </g>
        <g transform="translate(-83.1 48)">
          <circle class="pulse p5" r="7" fill="#F4C86A"/><circle r="7" fill="#F4C86A" filter="url(#tinyGlow)"/>
        </g>
        <g transform="translate(-83.1 -48)">
          <circle class="pulse p6" r="7" fill="#EAF1EC"/><circle r="7" fill="#EAF1EC"/>
        </g>
      </g>

      <!-- one shared record, at the centre -->
      <circle r="46" fill="#0B1512" fill-opacity=".72"/>
      <circle r="46" fill="none" stroke="#2DD4BF" stroke-opacity=".38" stroke-width="1.4"/>
      <g class="heart" filter="url(#softGlow)">
        <path transform="scale(1.75)" fill="#F0916F"
              d="M0 8C-2.5 4.5 -10 -0.5 -10 -6.5C-10 -10 -7 -12 -4.5 -12C-2 -12 -0.7 -10.5 0 -9.5C0.7 -10.5 2 -12 4.5 -12C7 -12 10 -10 10 -6.5C10 -0.5 2.5 4.5 0 8Z"/>
      </g>
    </g>

    <!-- ================= sparkles ================= -->
    <g fill="#FFE3A3">
      <path class="spark"    transform="translate(880 74)"  d="M0-7C-1 -1 -1 -1 -7 0C-1 1 -1 1 0 7C1 1 1 1 7 0C1 -1 1 -1 0 -7Z"/>
      <path class="spark k2" transform="translate(1216 96) scale(.8)" d="M0-7C-1 -1 -1 -1 -7 0C-1 1 -1 1 0 7C1 1 1 1 7 0C1 -1 1 -1 0 -7Z"/>
      <path class="spark k3" transform="translate(918 316) scale(.7)" d="M0-7C-1 -1 -1 -1 -7 0C-1 1 -1 1 0 7C1 1 1 1 7 0C1 -1 1 -1 0 -7Z"/>
      <path class="spark k4" transform="translate(1198 296) scale(.62)" d="M0-7C-1 -1 -1 -1 -7 0C-1 1 -1 1 0 7C1 1 1 1 7 0C1 -1 1 -1 0 -7Z"/>
      <path class="spark k5" transform="translate(838 216) scale(.55)" d="M0-7C-1 -1 -1 -1 -7 0C-1 1 -1 1 0 7C1 1 1 1 7 0C1 -1 1 -1 0 -7Z"/>
    </g>

    <!-- ================= award pill ================= -->
    <g class="rise r1">
      <rect x="64" y="56" width="392" height="42" rx="21" fill="#F4C86A" fill-opacity=".10"
            stroke="#F4C86A" stroke-opacity=".48" stroke-width="1.2"/>
      <clipPath id="pillClip"><rect x="64" y="56" width="392" height="42" rx="21"/></clipPath>
      <g clip-path="url(#pillClip)">
        <rect class="pill-shine" x="64" y="56" width="120" height="42" fill="url(#pillShine)"/>
      </g>

      <!-- laurel + star -->
      <g transform="translate(96 77)" filter="url(#tinyGlow)">
        <path d="M-11 8C-17 3 -17 -6 -11 -11" fill="none" stroke="#F4C86A" stroke-opacity=".8"
              stroke-width="1.6" stroke-linecap="round"/>
        <path d="M11 8C17 3 17 -6 11 -11" fill="none" stroke="#F4C86A" stroke-opacity=".8"
              stroke-width="1.6" stroke-linecap="round"/>
        <polygon fill="url(#gold)"
                 points="0,-9 2.29,-3.16 8.56,-2.78 3.71,1.21 5.29,7.28 0,3.9 -5.29,7.28 -3.71,1.21 -8.56,-2.78 -2.29,-3.16"/>
      </g>

      <text x="122" y="83" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="15.5" font-weight="700" letter-spacing="2.6" fill="#FFE3A3">WINNER · BEST DESIGN</text>
    </g>

    <!-- ================= wordmark ================= -->
    <g class="rise r2">
      <text x="64" y="212" font-family="Fraunces, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif"
            font-size="104" font-weight="700" letter-spacing="-1.5" fill="url(#wordmark)">Kintwadi</text>
    </g>
    <g mask="url(#wordMask)">
      <rect class="sheen" x="0" y="110" width="150" height="130" fill="url(#sheenGrad)"
            transform-origin="0 0" style="transform: translateX(-260px);"/>
    </g>

    <!-- ================= copy ================= -->
    <g class="rise r3">
      <text x="66" y="252" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="21" font-weight="500" fill="#C3D6CC">One shared record for everyone caring for someone.</text>
    </g>
    <g class="rise r4">
      <text x="66" y="282" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="13" font-weight="600" letter-spacing="2.2" fill="#6FCBBB"
            >KIKONGO: TOGETHERNESS — DOING IT AS ONE</text>
    </g>

    <!-- ================= chips ================= -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">
      <g class="rise r5">
        <rect x="64" y="304" width="268" height="34" rx="17" fill="#EAF1EC" fill-opacity=".055"
              stroke="#7FE3D4" stroke-opacity=".26"/>
        <circle cx="86" cy="321" r="4" fill="#2DD4BF"/>
        <text x="100" y="326" fill="#BFD5CB">Aurora PostgreSQL · pgvector · RLS</text>
      </g>
      <g class="rise r6">
        <rect x="344" y="304" width="186" height="34" rx="17" fill="#EAF1EC" fill-opacity=".055"
              stroke="#F4C86A" stroke-opacity=".26"/>
        <circle cx="366" cy="321" r="4" fill="#F4C86A"/>
        <text x="380" y="326" fill="#BFD5CB">Amazon Bedrock</text>
      </g>
      <g class="rise r6" style="animation-delay:1.04s">
        <rect x="542" y="304" width="212" height="34" rx="17" fill="#EAF1EC" fill-opacity=".055"
              stroke="#F0916F" stroke-opacity=".26"/>
        <circle cx="564" cy="321" r="4" fill="#F0916F"/>
        <text x="578" y="326" fill="#BFD5CB">Next.js 16 on Vercel</text>
      </g>
    </g>

    <!-- ================= hackathon line ================= -->
    <g class="rise r6" style="animation-delay:1.18s">
      <text x="66" y="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="12" font-weight="700" letter-spacing="3.4" fill="#8AA79B"
            >H0 · HACK THE ZERO STACK — VERCEL v0 × AWS DATABASES</text>
    </g>
  </g>

  <!-- ================= frame ================= -->
  <rect x="1" y="1" width="1278" height="378" rx="28" fill="none" stroke="url(#edge)" stroke-width="2"/>
</svg>
